<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충남스틸 - 철강 전문기업</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/board.css">
</head>
<body>
    <!-- include:header -->

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>충남스틸에 오신 것을 환영합니다</h1>
                <p>최고 품질의 철강 제품과 서비스를 제공하는 신뢰받는 기업</p>
                <button class="cta-button">자세히 보기</button>
            </div>
        </section>

        </section>

        <section class="features">
            <div class="container">
                <h2>왜 충남스틸인가?</h2>
                <div class="feature-grid">
                    <div class="feature-item">
                        <h3>최고 품질</h3>
                        <p>엄격한 품질 관리를 통한 우수한 제품 생산</p>
                    </div>
                    <div class="feature-item">
                        <h3>신속한 납품</h3>
                        <p>고객이 원하는 시간에 정확한 납품</p>
                    </div>
                    <div class="feature-item">
                        <h3>전문 상담</h3>
                        <p>경험이 풍부한 전문가의 맞춤형 상담</p>
                    </div>
                    <div class="feature-item">
                        <h3>합리적 가격</h3>
                        <p>품질 대비 최고의 가격 경쟁력</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="products-preview">
            <div class="container">
                <h2>주요 제품</h2>
                <div class="products-grid">
                    <div class="product-card">
                        <h3>철근</h3>
                        <p>건설용 고강도 철근</p>
                    </div>
                    <div class="product-card">
                        <h3>형강</h3>
                        <p>다양한 규격의 H빔, I빔</p>
                    </div>
                    <div class="product-card">
                        <h3>강판</h3>
                        <p>후판, 열연강판, 냉연강판</p>
                    </div>
                    <div class="product-card">
                        <h3>파이프</h3>
                        <p>각종 배관용 강관</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- include:footer -->
    <script src="/js/main.js"></script>
</body>
</html>
