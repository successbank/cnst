version: '3.8'

services:
  php:
    image: project5-php
    container_name: project1_php
    working_dir: /var/www/html
    volumes:
      - ./html:/var/www/html:rw
    expose:
      - "9000"
    networks:
      - project1_default
    restart: unless-stopped

  mysql:
    image: mariadb:10.11
    container_name: project1_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: project5_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - project1_default

  web:
    image: nginx:alpine
    container_name: project1_web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "1112:80"
    volumes:
      - ./html:/usr/share/nginx/html:rw
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:rw
    depends_on:
      - php
    networks:
      - project1_default

  pgadmin:
    image: dpage/pgadmin4
    container_name: project1_pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: successbank@nate.com
      PGADMIN_DEFAULT_PASSWORD: manpass!@#4
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - project1_default

networks:
  project1_default:
    driver: bridge

volumes:
  mysql_data:
    name: project1_mysql_data
  pgadmin_data: