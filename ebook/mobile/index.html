<!-- 목차 스타일 -->
<style>

    color: white;

    font-weight: bold;

<!-- 목차 JavaScript -->
<script>
// jQuery를 사용한 구현 (이미 jQuery가 로드되어 있음)
$(document).ready(function() {
    // 목차 데이터 로드
    loadTableOfContents();

    // 플로팅 버튼 클릭
    $('#floatingTocButton').on('click', function() {
        $('#tocModal').show();
    });

    // 닫기 버튼 클릭
    $('.toc-close').on('click', function() {
        $('#tocModal').hide();
    });

    // 모달 외부 클릭
    $('#tocModal').on('click', function(event) {
        if (event.target === this) {
            $(this).hide();
        }
    });
});

// 목차 데이터를 API에서 가져와서 렌더링
function loadTableOfContents() {
    $.ajax({
        url: '/api/ebook_toc.php',
        method: 'GET',
        dataType: 'json',
        success: function(response) {
            if (response.success && response.data) {
                renderTableOfContents(response.data);
            } else {
                showTocError('목차 데이터를 불러올 수 없습니다.');
            }
        },
        error: function(xhr, status, error) {
            console.error('목차 로드 오류:', error);
            showTocError('목차를 불러오는 중 오류가 발생했습니다.');
        }
    });
}

// 목차 HTML 렌더링
function renderTableOfContents(categories) {
    var html = '';

    categories.forEach(function(category) {
        html += '<div class="toc-section">';
        html += '<h3 class="toc-category">' +
                escapeHtml(category.category_icon) + ' ' +
                escapeHtml(category.category) + '</h3>';
        html += '<ul class="toc-items">';

        category.items.forEach(function(item) {
            html += '<li>';
            html += '<a href="#p=' + item.page_number + '" data-page="' + item.page_number + '">';
            html += escapeHtml(item.title);
            html += '</a>';
            html += '</li>';
        });

        html += '</ul>';
        html += '</div>';
    });

    $('#tocBody').html(html);

    // 목차 항목 클릭 이벤트 바인딩
    $('.toc-items a').on('click', function(e) {
        e.preventDefault();
        var page = $(this).attr('data-page');

        // 현재 URL 변경
        window.location.hash = 'p=' + page;

        // 모달 닫기
        $('#tocModal').hide();
    });
}

// 오류 메시지 표시
function showTocError(message) {
    var html = '<div style="text-align: center; padding: 40px; color: #f44336;">';
    html += '<div style="font-size: 32px; margin-bottom: 10px;">⚠️</div>';
    html += '<div>' + escapeHtml(message) + '</div>';
    html += '<div style="margin-top: 15px; font-size: 12px; color: #999;">';
    html += '관리자에게 문의하세요.';
    html += '</div>';
    html += '</div>';

    $('#tocBody').html(html);
}

// XSS 방지를 위한 HTML 이스케이프
function escapeHtml(text) {
    var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>
