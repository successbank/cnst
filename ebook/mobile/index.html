// jQuery를 사용한 구현
$(document).ready(function() {
    // 목차 렌더링
    renderTableOfContents();

    // 플로팅 버튼 클릭
    $('#floatingTocButton').on('click', function() {
        $('#tocModal').fadeIn(200);
    });

    // 닫기 버튼 클릭
    $('.toc-close').on('click', function() {
        $('#tocModal').fadeOut(200);
    });

    // 모달 외부 클릭
    $('#tocModal').on('click', function(event) {
        if (event.target === this) {
            $(this).fadeOut(200);
        }
    });

    // ESC 키로 모달 닫기
    $(document).on('keydown', function(e) {
        if (e.keyCode === 27) {
            $('#tocModal').fadeOut(200);
        }
    });
});

// 목차 HTML 렌더링
function renderTableOfContents() {
    var html = '';

    for (var i = 0; i < tocData.length; i++) {
        var category = tocData[i];
        html += '<div class="toc-section">';
        html += '<h3 class="toc-category">' + category.icon + ' ' + category.category + '</h3>';
        html += '<ul class="toc-items">';

        for (var j = 0; j < category.items.length; j++) {
            var item = category.items[j];
            html += '<li>';
            html += '<a href="javascript:void(0);" onclick="goToTocPage(' + item.page + ')">';
            html += item.title;
            html += '<span class="toc-page-num">p.' + item.page + '</span>';
            html += '</a>';
            html += '</li>';
        }

        html += '</ul>';
        html += '</div>';
    }

    $('#tocBody').html(html);
}

// 목차에서 페이지로 이동
function goToTocPage(pageNum) {
    // 모달 닫기
    $('#tocModal').fadeOut(200);

    // 약간의 딜레이 후 페이지 이동 (애니메이션 완료 후)
    setTimeout(function() {
        // gotoPageFun 함수가 존재하는지 확인
        if (typeof gotoPageFun === 'function') {
            gotoPageFun(pageNum);
        } else if (typeof flipBook !== 'undefined' && flipBook.gotoPage) {
            flipBook.gotoPage(pageNum);
        } else {
            // 대체: URL 해시 변경 후 페이지 리로드
            window.location.hash = 'p=' + pageNum;
            window.location.reload();
        }
    }, 250);
}
